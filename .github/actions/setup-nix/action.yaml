name: Setup Nix
description: Install Nix, configure Cachix, and cache the Nix store

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31.11.3
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix (numtide)
      uses: cachix/cachix-action@v17
      with:
        name: numtide
        authToken: ''

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

    - name: Load Nix development environment
      shell: bash
      run: nix develop --command true
