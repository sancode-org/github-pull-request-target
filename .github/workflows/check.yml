name: Check

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-nix
      - name: Typecheck
        run: nix develop --command pnpm check
